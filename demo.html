<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PHP-WASM - Hello World</title>

    <style>
        body {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
            font-family: Arial, sans-serif;
        }

        textarea {
            width: 100%;
            height: 220px;
            padding: 12px;
            box-sizing: border-box;
            font-family: monospace;
            font-size: 16px;
        }

        button {
            margin-top: 10px;
            padding: 10px 20px;
            cursor: pointer;
        }

        pre {
            margin-top: 20px;
            padding: 15px;
            background: #f3f3f3;
            min-height: 50px;
        }
    </style>
</head>

<body>

    <h1>PHP-WASM</h1>

    <textarea id="code"><?php
echo "Hello World !";
?></textarea>

    <br>

    <button id="run" disabled>Chargement de PHP...</button>

    <pre id="output"></pre>

    <script type="module">

        const output = document.querySelector("#output");
        const button = document.querySelector("#run");
        const textarea = document.querySelector("#code");

        let php;

        async function initPHP() {

            try {

                // Chargement de PHP-WASM depuis JSDelivr
                const { PhpWeb } = await import(
                    "https://cdn.jsdelivr.net/npm/php-wasm/PhpWeb.mjs"
                );

                // Création du runtime PHP
                php = new PhpWeb();

                // PHP écrit sur stdout
                php.addEventListener("output", event => {
                    output.textContent += event.detail;
                });

                // Erreurs PHP
                php.addEventListener("error", event => {
                    output.textContent += event.detail;
                });

                // Attendre que PHP soit prêt
                php.addEventListener("ready", () => {

                    button.disabled = false;
                    button.textContent = "Exécuter PHP";

                    output.textContent = "PHP est prêt.";
                });

            } catch (error) {

                output.textContent =
                    "Erreur de chargement de PHP-WASM :\n" +
                    error.message;

                console.error(error);
            }
        }

        button.addEventListener("click", async () => {

            if (!php) {
                return;
            }

            output.textContent = "";

            try {

                const code = textarea.value;

                await php.run(code);

            } catch (error) {

                output.textContent =
                    "Erreur :\n" +
                    error.message;

                console.error(error);
            }
        });

        initPHP();

    </script>

</body>
</html>
